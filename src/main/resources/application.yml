server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

# TCC 注册服务地址（动作名 -> 参与方地址与方法的映射从这里查）
tcc:
  registry:
    base-url: http://localhost:8083
